name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: Run PostgreSQL, migrations, integration and E2E checks
        required: false
        type: boolean
        default: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/patitas
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/patitas
      LOCAL_DATABASE_PORT: 54322
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://127.0.0.1:59000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:59000/product-media
      AUTH_JWT_ISSUER: patitas-api-test
      AUTH_JWT_AUDIENCE: patitas-test-clients
      CORS_ORIGINS: http://localhost:3000
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and architecture boundaries
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build backend
        run: pnpm build

      - name: Start PostgreSQL 17 and MinIO
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pnpm infra:start

      - name: Apply migrations to PostgreSQL 17
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pnpm db:deploy

      - name: Integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pnpm test:integration

      - name: E2E tests
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pnpm test:e2e
