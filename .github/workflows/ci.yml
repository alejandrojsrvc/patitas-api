name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/patitas
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/patitas
      LOCAL_DATABASE_PORT: 54322
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://127.0.0.1:59000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:59000/product-media
      AUTH_JWT_ISSUER: patitas-api-test
      AUTH_JWT_AUDIENCE: patitas-test-clients
      CORS_ORIGINS: http://localhost:3000
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 17 and MinIO
        run: pnpm infra:start

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to PostgreSQL 17
        run: pnpm db:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and architecture boundaries
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build backend
        run: pnpm build

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: patitas-api-production
      cancel-in-progress: false
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${DOKPLOY_URL}/api/application.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data-raw "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"
