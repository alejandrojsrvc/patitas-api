project_id = "patitas-api"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Debe coincidir con la versión mayor del proyecto Supabase Cloud.
major_version = "env(SUPABASE_DB_MAJOR_VERSION)"

[db.migrations]
# Las tablas propias se gestionan exclusivamente con prisma/migrations.
enabled = false
schema_paths = []

[db.seed]
# Los datos propios se gestionan exclusivamente con `prisma db seed`.
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets."product-media"]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/gif"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
